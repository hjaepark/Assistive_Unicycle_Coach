# train/unicycle_train/cotraining/configs/optimized.yaml

experiment:
  name: "optimized version"
  description: "5 parameters were tuned"

training:
  total_timesteps: 1000000
  seed: null # auto-generate
  allow_early_stopping: false
  eval_interval: 10000
  eval_episodes: 50
  target_success_rate: 0.95
  require_consecutive: 3

student:
  learning_rate: 0.0003
  buffer_size: 1000000
  learning_starts: 10000
  batch_size: 256
  tau: 0.005
  gamma: 0.99

coach:
  obs_dim: 22
  action_dim: 2
  learning_rate: 0.000481  # 0.0003 → 0.000481
  gamma: 0.99
  tau: 0.005
  auto_alpha: true
  device: "cpu"
  update_freq: 1
  gradient_steps: 30
  learning_starts: 10000

reward:
  rho: 0.742 # 0.5 → 0.742
  beta: 0.0115 # 0.05 → 0.0115
  lambda_E: 0.056 # 0.1 → 0.056
  kappa: [0.241, 0.241]  # [0.3, 0.3] → [0.241, 0.241]

estimator:
  type: "MARB"
