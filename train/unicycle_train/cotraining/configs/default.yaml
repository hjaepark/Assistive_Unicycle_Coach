# train/unicycle_train/cotraining/configs/default.yaml

experiment:
  name: "baseline"
  description: "Default configuration"

training:
  total_timesteps: 400000
  seed: null # auto-generate
  allow_early_stopping: false
  eval_interval: 50000
  eval_episodes: 100
  target_success_rate: 0.95
  require_consecutive: 3

student:
  # SAC hyperparameters based on BipedalWalker-v3 from rl-baselines3-zoo (https://github.com/DLR-RM/rl-baselines3-zoo/blob/ab4aadb57c6c42abcf1016318c2bebe35c4c1270/hyperparams/sac.yml#L41)
  learning_rate: 0.00073
  buffer_size: 300000
  learning_starts: 10000
  batch_size: 256
  tau: 0.02
  gamma: 0.98
  train_freq: 64
  gradient_steps: 64

coach:
  obs_dim: 22
  action_dim: 2
  learning_rate: 0.0003
  gamma: 0.99
  tau: 0.005
  auto_alpha: true
  device: "cpu"
  update_freq: 1
  gradient_steps: 10
  learning_starts: 10000

reward:
  rho: 0.5
  beta: 0.05 # usage penalty
  lambda_E: 0.1 # energy penalty
  kappa: [0.3, 0.3] # intervention scaling

estimator:
  type: "MARB"
