# train/unicycle_train/cotraining/configs/default.yaml

experiment:
  name: "baseline"
  description: "Default configuration"

training:
  total_timesteps: 400000
  seed: null # auto-generate
  allow_early_stopping: false
  eval_interval: 50000
  eval_episodes: 100
  target_success_rate: 0.95a
  require_consecutive: 3

student:
  learning_rate: 0.0003
  buffer_size: 1000000
  learning_starts: 10000
  batch_size: 256
  tau: 0.005
  gamma: 0.99

coach:
  obs_dim: 22
  action_dim: 2
  learning_rate: 0.0003
  gamma: 0.99
  tau: 0.005
  auto_alpha: true
  device: "cpu"
  update_freq: 1
  gradient_steps: 10
  learning_starts: 10000

reward:
  rho: 0.5
  beta: 0.05 # usage penalty
  lambda_E: 0.1 # energy penalty
  kappa: [0.3, 0.3] # intervention scaling

estimator:
  type: "MARB"
