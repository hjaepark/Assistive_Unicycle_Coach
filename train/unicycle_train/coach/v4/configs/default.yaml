# train/unicycle_train/coach/v4/configs/default.yaml
#
# V4 Phase 1: 10-student parallel training (proof of concept)
# Architecture identical to V3.1; only training regime differs.

training:
  seed: 42                        # coach/torch seed (does not affect reproducibility of students)
  K: 10                           # coaching episodes per iteration per student
  M: 10                           # self-practice episodes per iteration per student
  max_iterations: 500             # same as V3.1
  pi_update_every: 10
  pi_ppo_epochs: 4
  student_update_in_eval: true    # V3.1 setting

  # V4-specific
  n_students: 10
  student_seeds_start: 1000       # seeds: 1000, 1001, ..., 1009