experiment_name: "2_layer"
output_dir: "train/unicycle_train/coach/estimators/stb_artifacts/2_layer"

data:
  data_root: "train/unicycle_train/student/data"
  window_size: 6
  horizon: 1
  use_prev_reward: false
  feature_names: ["obs_0", "obs_1", "obs_2", "obs_3", "obs_4", "obs_5", "obs_6", "obs_7", "obs_8", "obs_9", "obs_10", "obs_11", "obs_12", "obs_13", "obs_14", "obs_15", "obs_16", "obs_17", "obs_18", "l"]

model:
  num_layers: 2
  hidden_dim: 32
  kernel_size: 3
  dropout: 0.0

training:
  device: "cuda"
  epochs: 20
  batch_size: 128
  learning_rate: 0.001